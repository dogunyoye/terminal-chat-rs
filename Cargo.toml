[package]
name = "terminal-chat-rs"
version = "0.1.0"
edition = "2021"
description = "A terminal based peer-to-peer chat service using WebSockets"
authors = ["Dimeji Ogunyoye <dogunyoye@googlemail.com>"]
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
ratatui = "0.30.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
rcgen = "0.14.10"
